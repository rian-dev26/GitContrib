<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GitContrib - Sistem Analisis Pola Kontribusi pada Repository GitHub Berbasis Machine Learning untuk evaluasi aktivitas proyek PBL." />
    <title>GitContrib — Analisis Pola Kontribusi Repository GitHub</title>
    
    <!-- Script pencegah flash tema saat reload -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('gitcontrib-theme-preference');
          var isDark = true;
          if (saved === 'light') {
            isDark = false;
          } else if (saved === 'system') {
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Google Font: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-app-bg text-app-text-primary font-sans antialiased min-h-screen selection:bg-app-accent-primary/30 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
